apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeapp
spec:
  replicas: 2
  
  selector:
     matchLabels:
        app: nodeapp

  template:
    metadata:
      labels:
        app: nodeapp
   
    spec:
      containers:
         - name: nodeapp-container
           image: kodekloud/centos-ssh-enabled:node
 
           ports:
             - containerPort: 8080