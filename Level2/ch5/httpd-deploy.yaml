apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-deploy
  namespace: nautilus
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 2
  
  selector: 
    matchLabels:
       app: httpd

  template:
    metadata:
      name: httpd
      labels: 
        app: httpd
    spec:
      containers:
        - name: httpd
          image: httpd:2.4.28