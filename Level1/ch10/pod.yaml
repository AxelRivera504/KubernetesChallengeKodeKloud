apiVersion: v1
kind: Pod
metadata:
   name: time-check
   namespace: devops
spec:
  containers:
    - name: time-check
      image: busybox:latest
      
      env:
        - name: TIME_FREQ
          valueFrom: 
              configMapKeyRef:
                 name: time-config 
                 key: TIME_FREQ
      
      command:
         - /bin/sh
         - -c
         - while true; do date >> /opt/security/time/time-check.log; sleep $(TIME_FREQ); done
      
      volumeMounts:
        - name: log-volume
          mountPath: /opt/security/time

  volumes:
    - name: log-volume
      emptyDir: {}
  